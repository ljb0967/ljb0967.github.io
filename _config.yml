baseurl: "" # the subpath of your site, e.g. /blog
url: "" # the base hostname & protocol for your site, e.g. http://example.com

# Build settings
markdown: kramdown
permalink: pretty
plugins:
  - jekyll-sitemap
compress_html:
  clippings: all
  comments: all
  startings: [html, head, body]

# Analytics
# analytics:
#   provider:
#     "google-gtag"
#     # false (default), "google", "google-universal", "google-gtag", "custom"
#   google:
#     tracking_id: "G-KHKPVQMPLB"
#     anonymize_ip: # true, false (default)

# Pages Path
defaults:
  - scope:
      path: "_pages"
    values:
      permalink: /:basename:output_ext

include:
  - _pages

sass:
  sass_dir: assets/scss
  style: compressed

# Exclude from processing.
exclude:
  - Gemfile
  - Gemfile.lock
  - LICENSE.text
  - README.md
  - SECURITY.md

#-------------------------------
# Visitor Counter 설정 (CountAPI 사용)
visitor_counter:
  provider:    countapi            # 사용할 서비스 (현재는 countapi.xyz)
  namespace:   ljb0967.github.io   # CountAPI 네임스페이스 (영문만)
  key_prefix:  daily_visits        # 일별 카운터 키 접두사

