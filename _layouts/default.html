<!-- ① 방문자 수를 표시할 요소 -->
<div id="daily-visit-count">오늘 방문자: 집계 중...</div>

<!-- ② CountAPI 호출 스크립트 -->
<script>
(function(){
  // 오늘 날짜(YYYY-MM-DD) 문자열 생성
  const today = new Date().toISOString().slice(0,10);
  // settings.yml에서 정의한 namespace와 key_prefix를 Liquid로 가져오기
  const namespace = "{{ site.visitor_counter.namespace }}";
  const prefix    = "{{ site.visitor_counter.key_prefix }}";
  const key       = `${prefix}_${today}`;

  // CountAPI hit 요청: 없으면 0→1, 있으면 +1
  fetch(`https://api.countapi.xyz/hit/${namespace}/${key}`)
    .then(res => res.json())
    .then(json => {
      // JSON 형태: { namespace, key, value }
      const count = json.value || 0;
      document.getElementById("daily-visit-count")
              .textContent = `오늘 방문자: ${count}명`;
    })
    .catch(err => {
      console.error("CountAPI error", err);
    });
})();
</script>
